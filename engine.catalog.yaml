description_long:
  zh: |-
    Qwen-Image 覆盖三类高频图像任务：文生图、按自然语言指令编辑已有图像、以及基于多张参考图的图生图。指令编辑可以直接说“把背景换成海边”“去掉左侧路人”，无需蒙版与局部重绘工具。

    中文提示词理解与中文字形渲染是它的强项，海报、封面、电商主图等含大量中文文案的场景表现稳定，减少后期补字。

    当前目录提供 GGUF Q8 单档精度，推荐 24GB 显存；显存不足时平台会按设备策略降级，但分辨率与并发需要相应调低。
  en: |-
    Qwen-Image covers three high-frequency image tasks: text-to-image, instruction-based editing of an existing image, and image-to-image with multiple references. Instruction editing handles requests such as "swap the background for a beach" or "remove the passer-by on the left" without masks or inpainting tools.

    Its strengths are Chinese prompt understanding and Chinese glyph rendering, which keeps posters, covers and e-commerce hero images with dense Chinese copy stable and reduces post-production text fixes.

    The catalog ships a single GGUF Q8 tier and recommends 24GB of VRAM; when memory is tight the platform applies its device policy, but resolution and concurrency must be reduced accordingly.
